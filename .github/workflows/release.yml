name: Release
# Triggered by pushing a tag like v0.1.0 — builds the release APK on the
# runner (full network) and publishes APK + .mcaddon as GitHub Release
# assets, i.e. permanent direct download links.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: pub get + localizations
        run: |
          cd app
          flutter pub get
          flutter gen-l10n

      - name: Android scaffolding (generated if absent)
        run: |
          cd app
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nova.schematic3d \
              --project-name schematic_3d .
          fi

      - name: Build release APK
        run: |
          cd app
          set -o pipefail
          flutter build apk --release 2>&1 | tail -n 60

      - name: Publish GitHub Release with direct-download assets
        shell: bash {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: /tmp/notes.md
        run: |
          set +e
          cp app/build/app/outputs/flutter-apk/app-release.apk /tmp/app-release.apk
          cat > /tmp/notes.md <<'NOTES'
          ## Schematic 3D — build 0.1.0 (CI: flutter 3.24.5, JDK 17)

          - `app-release.apk` — debug-signed test build (release key not set up).
          - `Schematic3DBuilder.mcaddon` — Bedrock add-on with 3 example designs.
          - `Schematic3DBuilder-base.mcaddon` — base pack, no bundled designs.

          Arabic + full docs: `README.md`, `docs/COMPATIBILITY.md`, `docs/TEST_REPORT.md`.
          Verified in CI: flutter analyze clean, 40/40 tests, APK builds.
          Device-level manual testing on Bedrock 1.26.40 (26.40.5) is still recommended.
          NOTES
          python3 scripts/publish_release.py "$GITHUB_REF_NAME" \
            /tmp/app-release.apk \
            dist/Schematic3DBuilder.mcaddon \
            dist/Schematic3DBuilder-base.mcaddon
          rc=$?
          exit "$rc"
