name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  discussions: write

jobs:
  converter:
    name: Python converter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install jsonschema pytest
      - name: pytest
        run: cd converter && python -m pytest tests/ -q

  addon:
    name: Bedrock add-on tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests (node:test)
        run: |
          cd bedrock_addon
          npm test
      - name: Regenerate tint vectors + compare (parity pin)
        run: |
          node bedrock_addon/scripts/gen_tint_vectors.mjs
          git diff --exit-code bedrock_addon/shared/tint_vectors.json
      - name: Build + validate mcaddon
        run: |
          python3 scripts/build_addon.py --version 1.0.0
          python3 scripts/validate_addon.py dist/Schematic3DBuilder-base.mcaddon
          python3 scripts/validate_addon.py dist/Schematic3DBuilder.mcaddon
      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon
          path: dist/*.mcaddon

  app:
    name: Flutter app (analyze + test + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify generated assets are in sync
        run: |
          python3 app/tool/gen_arb.py --check
          python3 app/tool/sync_addon_template.py
          git diff --exit-code -- app/assets/addon_template app/assets/generated/tint_vectors.json app/lib/l10n/ || {
            echo "::error::app assets/l10n out of sync — run app/tool/sync_addon_template.py and app/tool/gen_arb.py"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true
      - name: pub get
        run: cd app && (flutter pub get 2>&1 | tee /tmp/pubget.log)
      - name: Regenerate localizations
        run: cd app && (flutter gen-l10n 2>&1 | tee /tmp/genl10n.log)
      - name: Analyze
        run: |
          cd app
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log
      - name: Tests (pure domain + DB via ffi; no device needed)
        run: |
          cd app
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-test.log
      - name: Publish diagnostics as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## pub get (tail)";            tail -n 40 /tmp/pubget.log 2>/dev/null;
            echo "## gen-l10n (tail)";           tail -n 40 /tmp/genl10n.log 2>/dev/null;
            echo "## analyze (tail)";            tail -n 120 /tmp/analyze.log 2>/dev/null;
            echo "## flutter test (tail)";       tail -n 300 /tmp/flutter-test.log 2>/dev/null;
          } > /tmp/combined.md
          python3 - <<'PY'
          import json, os, subprocess
          body = open('/tmp/combined.md').read()[-45000:]
          payload = json.dumps({'body': body})
          sha = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          tok = os.environ['GH_TOKEN']
          r = subprocess.run(['curl', '-sS', '-X', 'POST',
              f'https://api.github.com/repos/{repo}/commits/{sha}/comments',
              '-H', f'Authorization: Bearer {tok}',
              '-H', 'Accept: application/vnd.github+json',
              '--data', payload], capture_output=True, text=True)
          print(r.stdout[-300:], r.stderr[-200:])
          PY
      - name: Android scaffolding (generated if absent)
        run: |
          cd app
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nova.schematic3d \
              --project-name schematic_3d .
          fi
      - name: Build release APK
        run: cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
