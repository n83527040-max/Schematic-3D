name: Release
# Triggered by pushing a tag like v0.1.0 — builds the release APK on the
# runner (full network) and publishes APK + .mcaddon as GitHub Release
# assets, i.e. permanent direct download links.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: pub get + localizations
        run: |
          cd app
          flutter pub get
          flutter gen-l10n

      - name: Android scaffolding (generated if absent)
        run: |
          cd app
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nova.schematic3d \
              --project-name schematic_3d .
          fi
      - name: Build release APK
        run: |
          cd app
          set -o pipefail
          flutter build apk --release 2>&1 | tail -n 60

      - name: Publish GitHub Release with direct-download assets
        shell: bash {0}
        run: |
          set +e
          { echo "## publish diagnostics ($(date))";
            echo "- ref=$GITHUB_REF sha=$GITHUB_SHA";
            echo "- gh=$(gh --version 2>&1 | head -1)";
            echo "- apk exists: $(ls -la app/build/app/outputs/flutter-apk/ 2>&1 | tr '\n' ' ')";
            echo "- dist: $(ls -la dist/ 2>&1 | tr '\n' ' ')"; } > /tmp/pubdiag.md
          if cp app/build/app/outputs/flutter-apk/app-release.apk /tmp/app-release.apk; then
            echo "- cp: OK ($(stat -c%s /tmp/app-release.apk) bytes)" >> /tmp/pubdiag.md
          else
            echo "- cp: FAILED" >> /tmp/pubdiag.md
          fi
          cat > /tmp/notes.md <<'NOTES'
          ## إصدار تجريبي مبني آليًا من CI (flutter 3.24.5، JDK 17)

          - `app-release.apk` — موقّع بمفتاح debug (تجريبي؛ لأغراض الاختبار على جهازك).
          - `Schematic3DBuilder.mcaddon` — حزمة Add-on كاملة بثلاثة تصاميم جاهزة.
          - `Schematic3DBuilder-base.mcaddon` — الحزمة الأساسية بدون تصاميم.

          المتطلبات: Minecraft Bedrock 1.26.40+ (اختُبر منطقيًا مقابل Construct v1.2.0).
          تفاصيل التطابق والقيود: `docs/COMPATIBILITY.md` و`docs/TEST_REPORT.md`.

          Requirements: import the .mcaddon into Bedrock 1.26.40+; the APK is a debug-signed test build.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            /tmp/app-release.apk \
            dist/Schematic3DBuilder.mcaddon \
            dist/Schematic3DBuilder-base.mcaddon \
            --title "Schematic 3D ${GITHUB_REF_NAME}" \
            --notes-file /tmp/notes.md \
            --repo "$GITHUB_REPOSITORY" > /tmp/pubout.txt 2>&1; rc=$?
          echo "- gh exit=$rc output:" >> /tmp/pubdiag.md
          sed 's/^/    /' /tmp/pubout.txt >> /tmp/pubdiag.md
          cat /tmp/pubdiag.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          # also mirror into commit comment (fetchable via api.github.com)
          echo "## release publish (v0.1.0 attempt)" > /tmp/body.md
          sed 's/^/    /' /tmp/pubdiag.md >> /tmp/body.md
          python3 - <<'PYEOF2'
import json,os,urllib.request
body=open('/tmp/body.md').read()[:60000]
req=urllib.request.Request(
  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
  data=json.dumps({'body':body}).encode(),
  headers={'Authorization':'token '+os.environ['GITHUB_TOKEN'],
           'Accept':'application/vnd.github+json'}, method='POST')
try:
    with urllib.request.urlopen(req) as r: print('comment posted', r.status)
except Exception as e: print('comment failed', e)
PYEOF2
          exit "$rc"
